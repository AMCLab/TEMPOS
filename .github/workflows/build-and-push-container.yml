name: build-and-push-container
run-name: build-and-push-container
on:
  workflow_dispatch:
  push:
    branches:
      - 'main'

permissions:
  contents: write  # Needed for tagging
  packages: write  # Needed for GHCR

jobs:
  tag-container-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history for tagger

      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - id: lower-repo
        name: Repository to lowercase
        run: |
          # portable lowercase (works in bash)
          echo "repository=$(echo $GITHUB_REPOSITORY | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/tempos:${{ steps.tag_version.outputs.new_tag }}
            ghcr.io/${{ github.repository_owner }}/tempos:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Show built tag
        run: |
          echo "Built and pushed container with tag: ${{ steps.tag_version.outputs.new_tag }}"

